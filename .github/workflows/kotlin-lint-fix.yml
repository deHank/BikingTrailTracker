name: Kotlin Lint & Fix

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.kt'
      - '**/*.kts'

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout Code (uses newer checkout version compatible with modern Node engines)
      # Do NOT force-override the ref here to let the lint-action manage it seamlessly
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' 
          distribution: 'zulu'

      # 3. Grant execute permission to Gradle
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # 4. Use Lint Action v3 (Fixes the fatal worktree error)
      - name: Lint and Auto-Fix Kotlin
        uses: wearerequired/lint-action@v3
        with:
          # Tells the action to commit any modifications back to the PR
          auto_fix: true
          commit_message: "style: auto-fix Kotlin styling via ktlint"
          
          # Trigger your project's gradle layout format task instead of custom flags
          # (Swap 'ktlintFormat' to your specific task like 'spotlessApply' if using Spotless)
          prettier: true
          prettier_command_prefix: ./gradlew ktlintFormat --no-daemon
